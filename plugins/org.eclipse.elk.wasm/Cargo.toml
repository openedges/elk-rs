[package]
name = "org-eclipse-elk-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly binding of elk-rs; shipped through the `elk-rs` npm package, not crates.io"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# cdylib binding: built and shipped by the npm workflow, never published to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
org-eclipse-elk-graph-json = { workspace = true }
