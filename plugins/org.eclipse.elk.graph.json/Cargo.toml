[package]
name = "org-eclipse-elk-graph-json"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ELK JSON graph import/export and the elkjs-compatible layout API of the Eclipse Layout Kernel, ported to pure Rust"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
org-eclipse-elk-graph = { workspace = true }
org-eclipse-elk-core = { workspace = true }
org-eclipse-elk-alg-disco = { workspace = true }
org-eclipse-elk-alg-force = { workspace = true }
org-eclipse-elk-alg-layered = { workspace = true }
org-eclipse-elk-alg-mrtree = { workspace = true }
org-eclipse-elk-alg-radial = { workspace = true }
org-eclipse-elk-alg-rectpacking = { workspace = true }
org-eclipse-elk-alg-spore = { workspace = true }
org-eclipse-elk-alg-vertiflex = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
mimalloc = { version = "0.1", optional = true }

[features]
default = []
mimalloc-alloc = ["mimalloc"]
