name: NAPI Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            # Cross-built on the arm64 runner; GitHub retires Intel macOS runners in fall 2027.
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install cross-compilation deps (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # rustc >= 1.98 passes --fix-cortex-a53-843419 for this target. napi-rs CLI does not
          # set a linker for aarch64-unknown-linux-gnu, so cargo falls back to the host `cc`
          # (x86_64) and rust-lld rejects the AArch64-only flag. Link with the cross gcc instead.
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - name: Install napi-cli
        run: npm install -g @napi-rs/cli
      - name: Build NAPI
        working-directory: plugins/org.eclipse.elk.napi
        run: npx napi build --release --platform --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.target }}
          path: plugins/org.eclipse.elk.napi/*.node

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing (npm OIDC) would add `id-token: write` here once the packages exist.
    # Release tags are `v<version>+rs.<N>` on the releases/* branches (see VERSIONING.md).
    # Extension tags (`-ext.N`, custom/* branches) are built but never published.
    # scripts/publish_npm.sh skips every package@version that is already on npm, so a
    # tag that does not bump the package version is a build-only tag.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-ext.') }}
    env:
      NPM_DIST_TAG: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM for main package
        working-directory: plugins/org.eclipse.elk.wasm
        run: |
          wasm-pack build --target web --out-dir ../org.eclipse.elk.js/dist/wasm --release
          rm -f ../org.eclipse.elk.js/dist/wasm/.gitignore ../org.eclipse.elk.js/dist/wasm/package.json
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move binaries to platform packages
        run: |
          for dir in artifacts/binding-*/; do
            for f in "$dir"*.node; do
              BASENAME=$(basename "$f" .node)
              TRIPLE=$(echo "$BASENAME" | sed 's/elk-layout\.//')
              if [ -d "plugins/org.eclipse.elk.js/npm/$TRIPLE" ]; then
                cp "$f" "plugins/org.eclipse.elk.js/npm/$TRIPLE/"
              fi
            done
          done
      - name: Publish packages not yet on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          # v0.11.1+rs.7 -> 0.11.1; every package.json must carry exactly this version.
          base="${GITHUB_REF_NAME#v}"
          base="${base%%+*}"
          case "$base" in
            *-*) echo "refusing to publish prerelease/extension version $base under dist-tag $NPM_DIST_TAG" >&2; exit 1 ;;
          esac
          sh scripts/publish_npm.sh --expect-version "$base"
