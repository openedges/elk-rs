name: Cargo Publish

# Publishes the `elk-layout` facade and the 17 `org-eclipse-elk-*` library crates
# to crates.io for `v<version>+rs.<N>` release
# tags (see VERSIONING.md). Extension tags (`-ext.N`) are never published, and
# scripts/publish_crates.py skips every crate@version that is already on
# crates.io, so a tag that does not bump the package version publishes nothing.
# A manual run (workflow_dispatch, from any ref) only performs
# `cargo publish --dry-run`.
#
# The very first publish of the crates is done locally (crates.io limits new
# crates to a burst of five, then one every ten minutes); see TESTING.md § 3.6.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Serialize tag runs; a second run simply skips what the first one published.
    concurrency:
      group: cargo-publish
      cancel-in-progress: false
    permissions:
      contents: read
      # Trusted Publishing (crates.io OIDC) would add `id-token: write` here once the crates exist.
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-ext.')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Show versions
        run: |
          cargo --version
          python3 scripts/bump_version.py --check
      - name: Publish crates not yet on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "push" ]; then
            echo "manual run: dry run only, nothing is uploaded"
            python3 scripts/publish_crates.py --dry-run
            exit 0
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "refusing to publish from $GITHUB_REF (not a v* tag)" >&2; exit 1 ;;
          esac
          # v0.11.1+rs.7 -> 0.11.1; every publishable crate must carry exactly this version.
          base="${GITHUB_REF_NAME#v}"
          base="${base%%+*}"
          case "$base" in
            *-*) echo "refusing to publish prerelease/extension version $base" >&2; exit 1 ;;
          esac
          python3 scripts/publish_crates.py --expect-version "$base"
