name: Perf

on:
  workflow_dispatch:
    inputs:
      recursive_scenarios:
        description: "Recursive layout scenario list (comma-separated; empty uses recursive_scenario_profile)"
        required: false
        default: ""
      recursive_scenario_profile:
        description: "Recursive layout scenario profile (quick|default|full)"
        required: false
        default: "default"
      recursive_runtime_budget_gate:
        description: "Fail when recursive scenario avg_ms exceeds profile budget (true|false)"
        required: false
        default: "false"
      layered_issue_scenarios:
        description: "Layered issue scenario list"
        required: false
        default: "issue_405,issue_603,issue_680,issue_871,issue_905"
      layered_issue_iterations:
        description: "Layered issue scenario iterations"
        required: false
        default: "20"
      layered_issue_warmup:
        description: "Layered issue scenario warmup iterations"
        required: false
        default: "3"
      parity_compare_mode:
        description: "Perf comparison mode (window|baseline|both)"
        required: false
        default: "window"
      regression_threshold:
        description: "Regression threshold percent"
        required: false
        default: "5"
      regression_window:
        description: "Regression moving window size"
        required: false
        default: "3"
      regression_gate:
        description: "Fail workflow on regression (true|false)"
        required: false
        default: "false"
      java_compare_enabled:
        description: "Enable Java vs Rust layered issue compare (true|false)"
        required: false
        default: "true"
      java_compare_mode:
        # `results` compares the Java CSV generated on this runner with the Rust CSV from the
        # same run. `baseline`/`both` also gate against tests/baselines/java_layered_issue_scenarios.csv,
        # which was measured on a maintainer machine and is not comparable to runner timings.
        description: "Java compare mode (results|baseline|both)"
        required: false
        default: "results"
      java_generate_enabled:
        description: "Generate Java layered issue CSV before compare (true|false)"
        required: false
        default: "true"
      java_generate_dry_run:
        description: "Print Java parity Maven command only (true|false)"
        required: false
        default: "false"
      java_allow_generate_failure:
        description: "Allow Java generation failure and continue (true|false)"
        required: false
        default: "false"
      java_skip_dns_check:
        description: "Skip Java generation DNS preflight (true|false)"
        required: false
        default: "false"
      java_export_baseline_candidate:
        description: "Export Java results as baseline candidate artifact (true|false)"
        required: false
        default: "true"
      java_parity_threshold:
        description: "Java parity regression threshold percent"
        required: false
        default: "0"
      java_parity_gate:
        description: "Fail workflow on Java parity regression (true|false)"
        required: false
        default: "true"
      java_baseline_parity_gate:
        description: "Fail workflow on Java baseline parity regression (true|false)"
        required: false
        default: "true"
      env_overrides:
        description: "Extra PARITY_* overrides, one KEY=VALUE per line (see the env block)"
        default: ""

# GitHub allows at most 25 workflow_dispatch inputs. Secondary parameters are kept here
# as defaults; override any of them at dispatch time through the `env_overrides` input
# (one KEY=VALUE per line, e.g. PARITY_GRAPH_NODES=2000).
env:
  PARITY_COMMENT_COUNT: "2000"  # Comment attachment count
  PARITY_COMMENT_ITERATIONS: "5"  # Comment attachment iterations
  PARITY_COMMENT_WARMUP: "1"  # Comment attachment warmup iterations
  PARITY_COMMENT_OUTPUT: "tests/results_comment_attachment.csv"  # Comment attachment output CSV path
  PARITY_GRAPH_NODES: "1000"  # Graph validation node count
  PARITY_GRAPH_EDGES: "2000"  # Graph validation edge count
  PARITY_GRAPH_ITERATIONS: "5"  # Graph validation iterations
  PARITY_GRAPH_WARMUP: "1"  # Graph validation warmup iterations
  PARITY_GRAPH_MODE: "both"  # Graph validation mode (nodes|edges|both)
  PARITY_GRAPH_OUTPUT: "tests/results_graph_validation.csv"  # Graph validation output CSV path
  PARITY_LAYOUT_NODES: "500"  # Recursive layout node count
  PARITY_LAYOUT_EDGES: "1000"  # Recursive layout edge count
  PARITY_LAYOUT_ITERATIONS: "5"  # Recursive layout iterations
  PARITY_LAYOUT_WARMUP: "1"  # Recursive layout warmup iterations
  PARITY_LAYOUT_ALGORITHM: "fixed"  # Recursive layout algorithm
  PARITY_LAYOUT_VALIDATE_GRAPH: "false"  # Validate graph before layout (true|false)
  PARITY_LAYOUT_VALIDATE_OPTIONS: "false"  # Validate options before layout (true|false)
  PARITY_LAYOUT_OUTPUT: "tests/results_recursive_layout.csv"  # Recursive layout output CSV path
  PARITY_RECURSIVE_SCENARIO_ITERATIONS: "5"  # Recursive layout scenario iterations
  PARITY_RECURSIVE_SCENARIO_WARMUP: "1"  # Recursive layout scenario warmup iterations
  PARITY_RECURSIVE_SCENARIO_OUTPUT: "tests/results_recursive_layout_scenarios.csv"  # Recursive layout scenarios output CSV path
  PARITY_RECURSIVE_RUNTIME_BUDGET_MS_QUICK: "40"  # Recursive runtime budget avg_ms for quick profile
  PARITY_RECURSIVE_RUNTIME_BUDGET_MS_DEFAULT: "60"  # Recursive runtime budget avg_ms for default profile
  PARITY_RECURSIVE_RUNTIME_BUDGET_MS_FULL: "120"  # Recursive runtime budget avg_ms for full profile
  PARITY_LAYERED_ISSUE_OUTPUT: "tests/results_layered_issue_scenarios.csv"  # Layered issue scenario output CSV path
  PARITY_BASELINE_LAYERED_FILE: "tests/baselines/layered_issue_scenarios.csv"  # Layered issue baseline CSV path
  PARITY_BASELINE_RECURSIVE_SCENARIOS_FILE: "tests/baselines/recursive_layout_scenarios.csv"  # Recursive layout scenarios baseline CSV path
  PARITY_JAVA_GENERATE_RETRIES: "0"  # Java generation retry count
  PARITY_JAVA_GENERATE_RETRY_DELAY_SECS: "3"  # Java generation retry delay seconds
  PARITY_JAVA_REQUIRED_HOSTS: "repo.eclipse.org,repo.maven.apache.org"  # Comma-separated required hosts for Java generation DNS preflight
  PARITY_JAVA_EXPORT_CANDIDATE_STRICT: "true"  # Fail when baseline candidate export validation fails (true|false)
  PARITY_JAVA_RESULTS_FILE: "tests/java_results_layered_issue_scenarios.csv"  # Java layered issue CSV path
  PARITY_JAVA_BASELINE_FILE: "tests/baselines/java_layered_issue_scenarios.csv"  # Java layered issue baseline CSV path
  PARITY_JAVA_BASELINE_CANDIDATE_FILE: "tests/baselines/java_layered_issue_scenarios.candidate.csv"  # Java layered issue baseline candidate CSV path
  PARITY_JAVA_ARTIFACT_MIN_ROWS: "1"  # Minimum required rows in Java CSV artifact (effective floor also respects scenario count)
  PARITY_JAVA_PARITY_THRESHOLDS_FILE: "tests/java_parity_thresholds.csv"  # Java per-scenario parity threshold CSV path
  PARITY_JAVA_BASELINE_PARITY_THRESHOLD: "0"  # Java baseline parity regression threshold percent

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Parity scripts read external/elk-models and build Java ELK from external/elk.
          submodules: true
      - id: pins
        name: the pinned Rust version (rust-toolchain.toml)
        run: echo "rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
      - uses: actions/setup-java@v4
        if: ${{ inputs.java_compare_enabled == 'true' }}
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maven 3.9 for the Tycho build
        if: ${{ inputs.java_compare_enabled == 'true' }}
        # external/elk builds with Tycho 4.0.12, which does not start under the Maven 3.10.0
        # shipped on ubuntu-latest ("No implementation for MavenTargetLocationFactory was
        # bound"), so a 3.9.x release is installed from the Apache archive instead.
        run: |
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          # dlcdn serves current releases quickly; archive.apache.org keeps every release
          # but took 2-5 minutes per download from the runner.
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://dlcdn.apache.org/maven/maven-3/${MAVEN_VERSION}/binaries/$archive" \
          || curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/$archive"
          echo "$MAVEN_SHA512  $RUNNER_TEMP/$archive" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
      - name: Show Java toolchain
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: |
          java -version
          mvn -v
      - name: Install ripgrep
        # scripts/check_algorithm_*_parity.sh and summarize_java_parity_status.sh use `rg`,
        # which the ubuntu-latest image does not ship.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version | head -1
      - name: Apply env overrides
        if: ${{ inputs.env_overrides != '' }}
        run: |
          printf '%s\n' "$ENV_OVERRIDES" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) ;;
              PARITY_*=*) echo "$line" >> "$GITHUB_ENV" ;;
              *) echo "Invalid env override (expected PARITY_KEY=VALUE): $line" >&2; exit 1 ;;
            esac
          done
        env:
          ENV_OVERRIDES: ${{ inputs.env_overrides }}
      - name: Run parity scripts
        run: sh scripts/run_parity_all.sh
        env:
          COMMENT_COUNT: ${{ env.PARITY_COMMENT_COUNT }}
          COMMENT_ITERATIONS: ${{ env.PARITY_COMMENT_ITERATIONS }}
          COMMENT_WARMUP: ${{ env.PARITY_COMMENT_WARMUP }}
          COMMENT_OUTPUT: ${{ env.PARITY_COMMENT_OUTPUT }}
          GRAPH_NODES: ${{ env.PARITY_GRAPH_NODES }}
          GRAPH_EDGES: ${{ env.PARITY_GRAPH_EDGES }}
          GRAPH_ITERATIONS: ${{ env.PARITY_GRAPH_ITERATIONS }}
          GRAPH_WARMUP: ${{ env.PARITY_GRAPH_WARMUP }}
          GRAPH_MODE: ${{ env.PARITY_GRAPH_MODE }}
          GRAPH_OUTPUT: ${{ env.PARITY_GRAPH_OUTPUT }}
          LAYOUT_NODES: ${{ env.PARITY_LAYOUT_NODES }}
          LAYOUT_EDGES: ${{ env.PARITY_LAYOUT_EDGES }}
          LAYOUT_ITERATIONS: ${{ env.PARITY_LAYOUT_ITERATIONS }}
          LAYOUT_WARMUP: ${{ env.PARITY_LAYOUT_WARMUP }}
          LAYOUT_ALGORITHM: ${{ env.PARITY_LAYOUT_ALGORITHM }}
          LAYOUT_VALIDATE_GRAPH: ${{ env.PARITY_LAYOUT_VALIDATE_GRAPH }}
          LAYOUT_VALIDATE_OPTIONS: ${{ env.PARITY_LAYOUT_VALIDATE_OPTIONS }}
          LAYOUT_OUTPUT: ${{ env.PARITY_LAYOUT_OUTPUT }}
          RECURSIVE_SCENARIO_PROFILE: ${{ inputs.recursive_scenario_profile }}
          RECURSIVE_SCENARIOS: ${{ inputs.recursive_scenarios }}
          RECURSIVE_SCENARIO_ITERATIONS: ${{ env.PARITY_RECURSIVE_SCENARIO_ITERATIONS }}
          RECURSIVE_SCENARIO_WARMUP: ${{ env.PARITY_RECURSIVE_SCENARIO_WARMUP }}
          RECURSIVE_SCENARIO_OUTPUT: ${{ env.PARITY_RECURSIVE_SCENARIO_OUTPUT }}
          LAYERED_ISSUE_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          LAYERED_ISSUE_ITERATIONS: ${{ inputs.layered_issue_iterations }}
          LAYERED_ISSUE_WARMUP: ${{ inputs.layered_issue_warmup }}
          LAYERED_ISSUE_OUTPUT: ${{ env.PARITY_LAYERED_ISSUE_OUTPUT }}
      - name: Compare parity results
        run: sh scripts/compare_parity_results.sh "${{ inputs.regression_window }}" | tee tests/compare.txt
        env:
          PARITY_COMPARE_MODE: ${{ inputs.parity_compare_mode }}
          PARITY_BASELINE_LAYERED_FILE: ${{ env.PARITY_BASELINE_LAYERED_FILE }}
          PARITY_BASELINE_RECURSIVE_SCENARIOS_FILE: ${{ env.PARITY_BASELINE_RECURSIVE_SCENARIOS_FILE }}
      - name: Check recursive runtime budget
        if: ${{ inputs.recursive_runtime_budget_gate == 'true' }}
        run: sh scripts/check_recursive_parity_runtime_budget.sh "${{ env.PARITY_RECURSIVE_SCENARIO_OUTPUT }}" "${{ inputs.recursive_scenario_profile }}" tests/recursive_runtime_budget.md
        env:
          RECURSIVE_RUNTIME_BUDGET_STRICT: "true"
          RECURSIVE_BUDGET_MS_QUICK: ${{ env.PARITY_RECURSIVE_RUNTIME_BUDGET_MS_QUICK }}
          RECURSIVE_BUDGET_MS_DEFAULT: ${{ env.PARITY_RECURSIVE_RUNTIME_BUDGET_MS_DEFAULT }}
          RECURSIVE_BUDGET_MS_FULL: ${{ env.PARITY_RECURSIVE_RUNTIME_BUDGET_MS_FULL }}
      - name: Check regression gate
        if: ${{ inputs.regression_gate == 'true' }}
        run: sh scripts/check_parity_regression.sh "${{ inputs.regression_threshold }}" "${{ inputs.regression_window }}"
        env:
          PARITY_COMPARE_MODE: ${{ inputs.parity_compare_mode }}
          PARITY_BASELINE_LAYERED_FILE: ${{ env.PARITY_BASELINE_LAYERED_FILE }}
          PARITY_BASELINE_RECURSIVE_SCENARIOS_FILE: ${{ env.PARITY_BASELINE_RECURSIVE_SCENARIOS_FILE }}
      - name: Run Java compare pipeline
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/run_parity_and_compare_java.sh "${{ env.PARITY_JAVA_RESULTS_FILE }}" "${{ inputs.regression_window }}" "${{ inputs.java_parity_threshold }}" tests/java_vs_rust.md
        env:
          LAYERED_ISSUE_SKIP_RUST_RUN: "true"
          LAYERED_ISSUE_OUTPUT: ${{ env.PARITY_LAYERED_ISSUE_OUTPUT }}
          LAYERED_ISSUE_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          LAYERED_ISSUE_ITERATIONS: ${{ inputs.layered_issue_iterations }}
          LAYERED_ISSUE_WARMUP: ${{ inputs.layered_issue_warmup }}
          JAVA_PARITY_COMPARE_MODE: ${{ inputs.java_compare_mode }}
          JAVA_PARITY_GENERATE: ${{ inputs.java_generate_enabled }}
          JAVA_PARITY_DRY_RUN: ${{ inputs.java_generate_dry_run }}
          JAVA_PARITY_ALLOW_GENERATE_FAILURE: ${{ inputs.java_allow_generate_failure }}
          JAVA_PARITY_RETRIES: ${{ env.PARITY_JAVA_GENERATE_RETRIES }}
          JAVA_PARITY_RETRY_DELAY_SECS: ${{ env.PARITY_JAVA_GENERATE_RETRY_DELAY_SECS }}
          JAVA_PARITY_SKIP_DNS_CHECK: ${{ inputs.java_skip_dns_check }}
          JAVA_PARITY_REQUIRED_HOSTS: ${{ env.PARITY_JAVA_REQUIRED_HOSTS }}
          JAVA_PARITY_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          JAVA_PARITY_ITERATIONS: ${{ inputs.layered_issue_iterations }}
          JAVA_PARITY_WARMUP: ${{ inputs.layered_issue_warmup }}
          JAVA_PARITY_OUTPUT: ${{ env.PARITY_JAVA_RESULTS_FILE }}
          JAVA_PARITY_EXTERNAL_ELK_ROOT: ${{ github.workspace }}/external/elk
          JAVA_PARITY_EXTERNAL_ISOLATE: "true"
          JAVA_PARITY_EXTERNAL_WORKTREE_ROOT: ${{ runner.temp }}
          # Keep the built ELK worktree: the Tycho build generates the src-gen/*Options.java
          # sources (gitignored in external/elk) that the parity checks below read.
          JAVA_PARITY_ISOLATION_DIR: ${{ runner.temp }}/elk-java-parity-build
          # Isolate Tycho/Maven metadata to avoid lock conflicts on shared runners.
          JAVA_PARITY_MVN_LOCAL_REPO: ${{ runner.temp }}/m2-java-parity-${{ github.run_id }}-${{ github.run_attempt }}
          JAVA_RESULTS_PARITY_GATE: ${{ inputs.java_parity_gate }}
          JAVA_BASELINE_FILE: ${{ env.PARITY_JAVA_BASELINE_FILE }}
          JAVA_BASELINE_OUTPUT: tests/java_vs_rust_baseline.md
          JAVA_BASELINE_THRESHOLD: ${{ env.PARITY_JAVA_BASELINE_PARITY_THRESHOLD }}
          JAVA_BASELINE_PARITY_GATE: ${{ inputs.java_baseline_parity_gate }}
          JAVA_ARTIFACT_MIN_ROWS: ${{ env.PARITY_JAVA_ARTIFACT_MIN_ROWS }}
          JAVA_ARTIFACT_REQUIRED_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          JAVA_PARITY_SCENARIO_THRESHOLDS_FILE: ${{ env.PARITY_JAVA_PARITY_THRESHOLDS_FILE }}
          JAVA_PARITY_VERIFY_ARTIFACTS: "true"
      - name: Export Java baseline candidate
        if: ${{ inputs.java_compare_enabled == 'true' && inputs.java_export_baseline_candidate == 'true' }}
        run: sh scripts/export_java_baseline_candidate.sh "${{ env.PARITY_JAVA_RESULTS_FILE }}" "${{ env.PARITY_JAVA_BASELINE_CANDIDATE_FILE }}" tests/java_baseline_candidate_status.md
        env:
          JAVA_CANDIDATE_MIN_ROWS: ${{ env.PARITY_JAVA_ARTIFACT_MIN_ROWS }}
          JAVA_CANDIDATE_REQUIRED_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          JAVA_CANDIDATE_STRICT: ${{ env.PARITY_JAVA_EXPORT_CANDIDATE_STRICT }}
      - name: Check Java baseline candidate readiness
        if: ${{ inputs.java_compare_enabled == 'true' && inputs.java_export_baseline_candidate == 'true' }}
        run: sh scripts/check_java_baseline_candidate.sh "${{ env.PARITY_JAVA_BASELINE_CANDIDATE_FILE }}" "${{ env.PARITY_LAYERED_ISSUE_OUTPUT }}" "${{ inputs.regression_window }}" "${{ inputs.java_parity_threshold }}" tests/java_baseline_candidate_check.md
        env:
          JAVA_CANDIDATE_MIN_ROWS: ${{ env.PARITY_JAVA_ARTIFACT_MIN_ROWS }}
          JAVA_CANDIDATE_REQUIRED_SCENARIOS: ${{ inputs.layered_issue_scenarios }}
          JAVA_CANDIDATE_REQUIRE_PARITY: "true"
          JAVA_CANDIDATE_STRICT: ${{ env.PARITY_JAVA_EXPORT_CANDIDATE_STRICT }}
          JAVA_CANDIDATE_PARITY_THRESHOLDS_FILE: ${{ env.PARITY_JAVA_PARITY_THRESHOLDS_FILE }}
          TARGET_BASELINE: ${{ env.PARITY_JAVA_BASELINE_FILE }}
      - name: Summarize Java parity status
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/summarize_java_parity_status.sh tests/java_vs_rust.md tests/java_vs_rust_baseline.md "${{ env.PARITY_JAVA_RESULTS_FILE }}" "${{ env.PARITY_JAVA_BASELINE_FILE }}" tests/java_parity_status.md
        env:
          RUST_RESULTS_FILE: ${{ env.PARITY_LAYERED_ISSUE_OUTPUT }}
          JAVA_BASELINE_CANDIDATE_FILE: ${{ env.PARITY_JAVA_BASELINE_CANDIDATE_FILE }}
          JAVA_BASELINE_CANDIDATE_REPORT: tests/java_baseline_candidate_status.md
          JAVA_BASELINE_CANDIDATE_CHECK_REPORT: tests/java_baseline_candidate_check.md
      - name: Suggest Java parity thresholds
        if: ${{ inputs.java_compare_enabled == 'true' }}
        run: sh scripts/suggest_java_parity_thresholds.sh "${{ env.PARITY_LAYERED_ISSUE_OUTPUT }}" "${{ env.PARITY_JAVA_RESULTS_FILE }}" "${{ inputs.regression_window }}" 2 tests/java_parity_thresholds.suggested.csv
      - name: Summarize parity results
        run: sh scripts/summarize_parity_results.sh
      - name: Locate generated ELK sources
        # external/elk ignores src-gen/**/*Options.java and *MetaDataProvider.java; the
        # Java compare step's Tycho build generates them in the persistent worktree.
        run: |
          core_options=plugins/org.eclipse.elk.core/src-gen/org/eclipse/elk/core/options/CoreOptions.java
          for root in "$RUNNER_TEMP/elk-java-parity-build" "$GITHUB_WORKSPACE/external/elk"; do
            if [ -f "$root/$core_options" ]; then
              echo "JAVA_SOURCES_ROOT=$root/plugins" >> "$GITHUB_ENV"
              echo "JAVA_CORE_OPTIONS=$root/$core_options" >> "$GITHUB_ENV"
              echo "using ELK sources from $root"
              exit 0
            fi
          done
          echo "::error::generated ELK sources (src-gen/**/*Options.java) not found; run with java_compare_enabled=true so the Tycho build generates them" >&2
          exit 1
      - name: Check CoreOptions parity
        run: sh scripts/check_core_options_parity.sh
      - name: Check Core option dependency parity
        run: sh scripts/check_core_option_dependency_parity.sh
      - name: Check algorithm ID parity
        run: sh scripts/check_algorithm_id_parity.sh
      - name: Check algorithm category parity
        run: sh scripts/check_algorithm_category_parity.sh
      - name: Check algorithm name parity
        run: sh scripts/check_algorithm_name_parity.sh
      - name: Check algorithm description parity
        run: sh scripts/check_algorithm_description_parity.sh
      - name: Check algorithm option support parity
        run: sh scripts/check_algorithm_option_support_parity.sh
      - name: Check algorithm option default parity
        run: sh scripts/check_algorithm_option_default_parity.sh
      - name: Check algorithm option default value parity
        run: sh scripts/check_algorithm_option_default_value_parity.sh
      - name: Check algorithm feature parity
        run: sh scripts/check_algorithm_feature_parity.sh
      - name: Check algorithm metadata parity
        run: sh scripts/check_algorithm_metadata_parity.sh
      - name: Check layered phase wiring parity
        run: sh scripts/check_layered_phase_wiring_parity.sh
      - name: Upload parity artifacts
        # Keep the CSV/report outputs of failed runs for diagnosis.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: |
            tests/*.csv
            tests/compare.txt
            tests/recursive_runtime_budget.md
            tests/java_vs_rust.md
            tests/java_vs_rust_baseline.md
            tests/java_parity_status.md
            tests/java_baseline_candidate_status.md
            tests/java_baseline_candidate_check.md
            tests/core_options_parity.md
            tests/core_option_dependency_parity.md
            tests/algorithm_id_parity.md
            tests/algorithm_category_parity.md
            tests/algorithm_name_parity.md
            tests/algorithm_description_parity.md
            tests/algorithm_option_support_parity.md
            tests/algorithm_option_default_parity.md
            tests/algorithm_option_default_value_parity.md
            tests/algorithm_feature_parity.md
            tests/algorithm_metadata_parity.md
            tests/layered_phase_wiring_parity.md
            tests/layered_phase_wiring/*.tsv
            tests/summary.md
            tests/baselines/*.csv
